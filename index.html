<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RCTT Heppignies</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f7861e">
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- iPhone / iPad -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RCTT">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; overflow: hidden; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0;
           padding-top: env(safe-area-inset-top); box-sizing: border-box; }
    #chargement { position: fixed; inset: 0; display: flex; flex-direction: column;
                  align-items: center; justify-content: center; gap: 16px;
                  font-family: system-ui, sans-serif; color: #555; background: #fff;
                  transition: opacity .3s; }
    #chargement img { width: 140px; height: 140px; }
    #horsligne { display: none; position: fixed; inset: 0; align-items: center;
                 justify-content: center; flex-direction: column; gap: 12px;
                 font-family: system-ui, sans-serif; color: #333; background: #fff;
                 text-align: center; padding: 24px; }
    #horsligne button { padding: 10px 20px; border: 0; border-radius: 8px;
                        background: #f7861e; color: #fff; font-size: 16px; }
  </style>
</head>
<body>
  <div id="chargement">
    <img src="icon-192.png" alt="">
    <div>Chargement…</div>
  </div>

  <div id="horsligne">
    <img src="icon-192.png" alt="" width="120" height="120">
    <p>Pas de connexion Internet.<br>L'application a besoin d'Internet pour afficher les données.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>

  <iframe id="app"
    src="https://script.google.com/macros/s/AKfycbyYLDA4k4_VPRs06na2JzP2qmIy7MXY7RHQv5q5zPTjry7JEIsQMqJn4BgUUNP92dByUw/exec"
    allow="clipboard-write; fullscreen"
    title="RCTT Heppignies"></iframe>

  <script>
    var app = document.getElementById('app');
    var chargement = document.getElementById('chargement');
    app.addEventListener('load', function () {
      chargement.style.opacity = '0';
      setTimeout(function () { chargement.style.display = 'none'; }, 300);
    });
    if (!navigator.onLine) {
      document.getElementById('horsligne').style.display = 'flex';
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
